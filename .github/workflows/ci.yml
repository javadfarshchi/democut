name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy opencv-python-headless pillow
      - run: npm install && npx playwright install --with-deps chromium
      - name: Validate JSON
        run: for f in .claude-plugin/*.json examples/taskboard/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Record the example
        run: node examples/taskboard/record.mjs .takes
      - name: Build a silent draft
        run: python skills/democut/kit/build.py examples/taskboard/storyboard.json --takes .takes --out out --cut short --tts none --preset ultrafast --sheet
      - uses: actions/upload-artifact@v4
        with: { name: draft, path: out/ }
